name: Publish reviewed research site
on:
  workflow_dispatch:
    inputs:
      confirm_publication:
        description: "Type PUBLISH after approving this commit and enabling Pages"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit dispatch approval and main branch
        if: ${{ inputs.confirm_publication != 'PUBLISH' || github.ref != 'refs/heads/main' }}
        run: exit 1
      - name: Checkout reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Run current offline suite
        run: node --test tests/research.test.mjs tests/audit.test.mjs tests/publication.test.mjs
      - name: Verify the staged release
        run: node tools/check-staging.mjs
      - name: Rebuild in a fresh directory
        id: build
        shell: bash
        run: |
          set -euo pipefail
          build_parent=$(mktemp -d "$RUNNER_TEMP/rayls-build.XXXXXX")
          site_path="$build_parent/site"
          node verify.mjs --out "$site_path"
          node tools/check-staging.mjs --built "$site_path"
          echo "site_path=$site_path" >> "$GITHUB_OUTPUT"
      - name: Read existing Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ steps.build.outputs.site_path }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
